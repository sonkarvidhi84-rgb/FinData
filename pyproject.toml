[project]
name = "findata"
version = "0.1.0"
description = "Acquire, validate, model and monitor Indian & global financial market data with measurable data quality."
readme = "README.md"
authors = [
    { name = "vidhiSonaksonkarvidhi84-rgb", email = "sonkarvidhi84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "joblib>=1.6.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "yfinance>=1.7.0",
]

[project.scripts]
findata = "findata.cli:app"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PD", "NPY"]
ignore = ["PD008", "PD011", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "pandera.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "sklearn.*", "joblib.*", "plotly.*", "streamlit.*", "scipy.*", "statsmodels.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/findata"]
omit = ["src/findata/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
